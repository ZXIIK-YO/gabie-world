<!--
  Cole no <head>, ANTES de qualquer CSS.
  Pinta o data-theme antes do primeiro paint e evita o flash branco
  para quem está no escuro.
-->
<meta name="theme-color" content="#FFF9FB">
<script>
  (function () {
    try {
      var p = localStorage.getItem('gw-theme');
      var dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', dark ? '#09090B' : '#FFF9FB');
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>
